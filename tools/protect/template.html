<!DOCTYPE html>
<html class="staticrypt-html" lang="zh-Hant-TW">

        <title>/*[|template_title|]*/0</title>

        <meta name="robots" content="noindex" />
        <meta name="color-scheme" content="light dark" />

        <meta http-equiv="cache-control" content="max-age=0" />

        <style>
            :root {
                --bg: #fbfaf8;
                --card: #ffffff;
                --fg: #1f2328;
                --muted: #656d76;
                --line: #e3e1dc;
                --field: #f0eee9;
                --accent: #2f6f5e;
                --on-accent: #ffffff;
                --bad: #b4441b;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #15171a;
                    --card: #1c1f23;
                    --fg: #e6e8eb;
                    --muted: #9aa3ad;
                    --line: #2c3036;
                    --field: #22262b;
                    --accent: #7cc4ad;
                    --on-accent: #10241e;
                    --bad: #f59e6b;
                }
            }
            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }
            .staticrypt-body {
                background: var(--bg);
                color: var(--fg);
                font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
                -webkit-font-smoothing: antialiased;
                -webkit-text-size-adjust: 100%;
            }
            .hidden {
                display: none !important;
            }
            .staticrypt-page {
                max-width: 400px;
                margin: 0 auto;
                padding: 72px 16px 48px;
                box-sizing: border-box;
            }
            .staticrypt-form {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 28px 24px;
            }
            .staticrypt-instructions p {
                margin: 0;
            }
            .staticrypt-title {
                font-size: 22px;
                font-weight: 650;
                margin-bottom: 4px !important;
            }
            .staticrypt-hint {
                color: var(--muted);
                font-size: 15px;
                margin-bottom: 20px !important;
            }
            .staticrypt-password-container {
                position: relative;
                margin: 0 0 12px;
            }
            #staticrypt-password {
                width: 100%;
                box-sizing: border-box;
                font: inherit;
                font-size: 16px;
                color: var(--fg);
                background: var(--field);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 12px 48px 12px 14px;
                outline: 0;
            }
            #staticrypt-password:focus {
                border-color: var(--accent);
            }
            .staticrypt-toggle-password-visibility {
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                height: 20px;
                padding: 10px;
                cursor: pointer;
                opacity: 0.55;
            }
            @media (prefers-color-scheme: dark) {
                .staticrypt-toggle-password-visibility {
                    filter: invert(1);
                }
            }
            .staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--muted);
                font-size: 15px;
                margin: 0 0 16px;
                cursor: pointer;
            }
            .staticrypt-remember input {
                width: 18px;
                height: 18px;
                margin: 0;
                accent-color: var(--accent);
            }
            .staticrypt-decrypt-button {
                width: 100%;
                font: inherit;
                font-weight: 600;
                color: var(--on-accent);
                background: var(--accent);
                border: 0;
                border-radius: 8px;
                padding: 12px;
                cursor: pointer;
                -webkit-appearance: none;
                appearance: none;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus-visible {
                filter: brightness(95%);
            }
            .staticrypt-error {
                color: var(--bad);
                font-size: 15px;
                margin: 12px 0 0;
            }
            .staticrypt-back {
                display: inline-block;
                margin-top: 24px;
                color: var(--muted);
                font-size: 14px;
                text-decoration: none;
            }
            .staticrypt-back:hover {
                color: var(--accent);
            }
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                width: 2rem;
                height: 2rem;
                box-sizing: border-box;
                border: 0.25em solid var(--muted);
                border-right-color: transparent;
                border-radius: 50%;
                animation: staticrypt-spin 0.75s linear infinite;
            }
            @keyframes staticrypt-spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .staticrypt-spinner {
                    animation-duration: 2s;
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">

            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">

                    <form id="staticrypt-form" action="#" method="post">

                        <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
                        <p id="staticrypt-error" class="staticrypt-error hidden" role="alert"></p>
                    </form>
                </div>
                <a class="staticrypt-back" href="/">← 回首頁</a>
            </div>
        </div>

        <script>
            // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            // you can edit these values to customize some of the behavior of StatiCrypt
            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            // init the staticrypt engine
            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // try to automatically decrypt on load if there is a saved password
            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

                // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
                // replaced, no need to do anything
                if (!isSuccessful) {
                    // hide loading screen
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    document.getElementById("staticrypt-password").focus();

                    // show the remember me checkbox
                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }
                }
            };

            const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");

            const imgSrcEyeOpened =

                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission: show the error under the button instead of an alert()
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const passwordInput = document.getElementById("staticrypt-password"),
                    errorBox = document.getElementById("staticrypt-error"),
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                errorBox.classList.add("hidden");
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(passwordInput.value, isRememberChecked);

                if (!isSuccessful) {
                    errorBox.textContent = templateError;
                    errorBox.classList.remove("hidden");
                    passwordInput.select();
                }
            });

</html>
