<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>上線不要說應該沒問題｜工程師上班模擬</title>
<meta name="description" content="工程師上班模擬遊戲：寫 code、code review、交測、部署、處理線上告警，還要應付一直變的需求。">
<meta name="theme-color" content="#151A23">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F8FCB'/%3E%3Ctext x='32' y='42' font-size='28' font-family='monospace' font-weight='700' text-anchor='middle' fill='white'%3E%26lt;/%26gt;%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand">上線不要說應該沒問題<small id="lvLabel">工程師上班模擬</small></div>
    <div class="clockbox"><div class="clock" id="clock">09:00</div><div class="sub" id="left">選擇關卡開始</div></div>
    <div class="meters">
      <div class="meter"><div class="lab"><span>精神</span><span id="vEn">100%</span></div><div class="bar"><i id="bEn"></i></div></div>
      <div class="meter"><div class="lab"><span>膀胱</span><span id="vBl">15%</span></div><div class="bar"><i id="bBl"></i></div></div>
      <div class="meter small"><div class="lab"><span>肚子</span></div><div class="val" id="vHu">還好</div></div>
    </div>
    <div class="hot" id="hotChip" hidden></div>
    <div class="scorebox"><div class="lab">分數</div><div class="score" id="score">0</div><div id="scoreDelta"></div></div>
    <div class="hbtns"><button class="hbtn phone" id="btnPhone" hidden>📟 接 page</button><button class="hbtn leave" id="btnLeave" hidden>下班 🏃</button><button class="hbtn" id="btnWait" hidden>⏩ 等一下 (F)</button><button class="hbtn" id="btnHelp">說明</button><button class="hbtn" id="btnPause">暫停</button></div>
  </header>

  <main class="stage">
    <canvas id="cv" aria-label="辦公室平面圖"></canvas>
  </main>

  <aside class="side">
    <section><h2 id="boardTitle">今日看板</h2><div id="board" class="board"></div></section>
    <section><h3>等你處理</h3><ul id="todo" class="todo"></ul></section>
    <section><h3>動態</h3><ul id="feed" class="feed"></ul></section>
  </aside>
</div>

<div class="ov" id="ov" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
