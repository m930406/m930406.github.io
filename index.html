<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>m930406</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M9 22V13l7 6 7-6v9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fbfaf8;
  --fg: #1f2328;
  --muted: #656d76;
  --line: #e3e1dc;
  --chip: #f0eee9;
  --accent: #2f6f5e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a;
    --fg: #e6e8eb;
    --muted: #9aa3ad;
    --line: #2c3036;
    --chip: #22262b;
    --accent: #7cc4ad;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 72px 16px 48px; }
.eyebrow, footer { font-size: 13px; color: var(--muted); }
.eyebrow { letter-spacing: .04em; margin: 0 0 8px; }
h1 { font-size: 30px; line-height: 1.3; font-weight: 650; margin: 0 0 8px; }
.lede { color: var(--muted); margin: 0 0 24px; }

.cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.cats a { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--chip); color: inherit; text-decoration: none; font-size: 14px; }
.cats a:hover { color: var(--accent); }
.cats .n { font-size: 12px; color: var(--muted); }

.cat { padding-top: 32px; scroll-margin-top: 16px; }
.cat h2 { display: flex; align-items: baseline; gap: 8px; font-size: 18px; font-weight: 650; margin: 0 0 8px; }
.cat h2 .n { font-size: 13px; font-weight: 400; color: var(--muted); }

.pages { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.pages li { border-bottom: 1px solid var(--line); }
.pages a { display: block; padding: 16px 4px; color: inherit; text-decoration: none; border-radius: 6px; }
.pages a:hover .name { color: var(--accent); }
.name { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--muted); margin-left: 8px; white-space: nowrap; }
.desc { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
.pages .empty { padding: 16px 4px; color: var(--muted); }

a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { margin-top: 56px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">m930406.github.io</p>
  <h1>頁面</h1>
  <p class="lede">各個專案發布的公開頁面，依類別整理在這裡。</p>

  <nav class="cats" aria-label="分類">
    <a href="#games">遊戲 <span class="n">1</span></a>
    <a href="#travel">旅遊 <span class="n">0</span></a>
  </nav>

  <section class="cat" id="games" aria-labelledby="games-h">
    <h2 id="games-h">遊戲 <span class="n">1</span></h2>
    <ul class="pages">
      <li>
        <a href="games/oncall-sim/">
          <span class="name">上線不要說應該沒問題</span>
          <span class="desc">工程師上班模擬：寫 code、code review、交測、部署，還要應付一直變的需求和半夜的 page。</span>
        </a>
      </li>
    </ul>
  </section>

  <section class="cat" id="travel" aria-labelledby="travel-h">
    <h2 id="travel-h">旅遊 <span class="n">0</span></h2>
    <ul class="pages">
      <li class="empty">之後會放行程和旅遊文件。</li>
    </ul>
  </section>

  <footer>以 GitHub Pages 架設</footer>
</main>
</body>
</html>
